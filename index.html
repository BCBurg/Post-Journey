<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REFLECT | REFRESH — Post-Journey Access</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0d0d0d;
    --gold: #f0bc2e;
    --gold-dim: #7a6018;
    --gold-faint: rgba(240,188,46,0.15);
    --white: #ffffff;
    --text-muted: rgba(255,255,255,0.5);
    --border: rgba(255,255,255,0.1);
    --red: #e05555;
    --green: #4caf7d;
  }
  html, body {
    height: 100%;
    background: var(--black);
    color: var(--white);
    font-family: 'Cinzel', serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }

  .gate-box {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.75rem;
  }

  .gate-logo {
    height: 56px;
    width: auto;
  }

  .gold-rule {
    width: 60px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .gate-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.2rem, 3vw, 1.6rem);
    font-weight: 700;
    color: var(--white);
    letter-spacing: 0.1em;
    text-align: center;
  }

  .gate-subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1rem, 2vw, 1.2rem);
    color: var(--text-muted);
    text-align: center;
    line-height: 1.6;
    margin-top: -0.75rem;
  }

  .gate-form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .field-label {
    font-size: clamp(0.7rem, 1.2vw, 0.82rem);
    letter-spacing: 0.25em;
    color: var(--gold-dim);
    text-transform: uppercase;
    margin-bottom: 0.4rem;
    display: block;
  }

  .gate-input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--white);
    font-family: 'Cinzel', serif;
    font-size: clamp(1rem, 2vw, 1.15rem);
    letter-spacing: 0.12em;
    padding: 1rem 1.25rem;
    outline: none;
    transition: border-color 0.2s;
    text-transform: uppercase;
    text-align: center;
  }
  .gate-input:focus { border-color: var(--gold); }
  .gate-input::placeholder {
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.05em;
    text-transform: none;
  }

  .gate-btn {
    font-family: 'Cinzel', serif;
    font-size: clamp(0.85rem, 1.6vw, 1rem);
    font-weight: 700;
    letter-spacing: 0.2em;
    padding: 1.1rem 2rem;
    border: 2px solid var(--gold);
    background: transparent;
    color: var(--white);
    cursor: pointer;
    transition: all 0.25s ease;
    text-transform: uppercase;
    width: 100%;
  }
  .gate-btn:hover { background: var(--gold); color: var(--black); }

  /* ── STATUS MESSAGES ── */
  .gate-message {
    width: 100%;
    padding: 1rem 1.25rem;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1rem, 1.8vw, 1.15rem);
    line-height: 1.6;
    text-align: center;
    display: none;
  }
  .gate-message.error {
    border: 1px solid var(--red);
    background: rgba(224,85,85,0.08);
    color: rgba(255,255,255,0.85);
  }
  .gate-message.expired {
    border: 1px solid var(--gold-dim);
    background: rgba(240,188,46,0.06);
    color: rgba(255,255,255,0.85);
  }
  .gate-message.success {
    border: 1px solid var(--green);
    background: rgba(76,175,125,0.08);
    color: rgba(255,255,255,0.85);
  }
  .gate-message a {
    color: var(--gold);
    text-decoration: none;
  }
  .gate-message a:hover { text-decoration: underline; }

  .gate-footer {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(0.85rem, 1.5vw, 1rem);
    color: rgba(255,255,255,0.2);
    text-align: center;
    line-height: 1.6;
  }

  /* ── SHAKE ANIMATION for wrong code ── */
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  .shake { animation: shake 0.4s ease; }
</style>
</head>
<body>

<div class="gate-box">

  <a href="https://reflectrefresh.org">
    <img class="gate-logo" src="../REFLECT_REFRESH_Brand_White.png" alt="Reflect Refresh">
  </a>

  <div class="gold-rule"></div>

  <div>
    <div class="gate-title">Post-Journey Resources</div>
    <div class="gate-subtitle" style="margin-top:0.75rem;">Enter the passcode provided by your facilitators<br>to access your post-retreat tools.</div>
  </div>

  <div class="gate-form">
    <div>
      <label class="field-label" for="passcode">Cohort Passcode</label>
      <input
        class="gate-input"
        id="passcode"
        type="text"
        placeholder="Enter your passcode"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="characters"
        spellcheck="false"
        onkeydown="if(event.key==='Enter') checkCode()"
      >
    </div>
    <button class="gate-btn" onclick="checkCode()">Enter</button>
  </div>

  <div class="gate-message" id="gate-msg"></div>

  <div class="gate-footer">
    "Therefore what God has joined together,<br>let man not separate." — Mark 10:9
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// COHORT PASSCODE CONFIGURATION
//
// Each cohort entry has:
//   hash    — SHA-256 hash of the passcode (UPPERCASE, no spaces)
//   expires — date after which the code stops working (YYYY-MM-DD)
//   label   — internal label for your reference (not shown to users)
//
// TO ADD A NEW COHORT:
//   1. Go to: https://reflectrefresh.org/Post-Journey/hash-tool.html
//   2. Enter the new passcode and copy the hash
//   3. Add a new entry to the COHORTS array below
//
// TO EXPIRE A COHORT:
//   Simply change the expires date to a past date, or remove the entry.
// ═══════════════════════════════════════════════════════════════════
const COHORTS = [
  {
    label:   'MS Baptist SAA — April 2026',
    hash:    '75361592e5e0f5c13423acfa6a1989e73a35f3a7a838fa1f69cc4ec08a5cb9ea',
    expires: '2026-10-01'
  },
  // ── ADD FUTURE COHORTS HERE ──
  // {
  //   label:   'Your Church Name — Month Year',
  //   hash:    'paste-hash-from-hash-tool-here',
  //   expires: 'YYYY-MM-DD'
  // },
];

// ── ACCESS TOKEN ──
const TOKEN_KEY  = 'rr_pj_access';
const TOKEN_DAYS = 1; // Re-check daily so expired codes kick out promptly

// ── CHECK IF ALREADY AUTHENTICATED ──
function isAuthenticated() {
  try {
    const token = JSON.parse(localStorage.getItem(TOKEN_KEY));
    if (!token) return false;
    // Check token hasn't expired
    if (Date.now() > token.expires) {
      localStorage.removeItem(TOKEN_KEY);
      return false;
    }
    // Re-validate the stored hash is still in an active cohort
    const cohort = COHORTS.find(c => c.hash === token.hash);
    if (!cohort) { localStorage.removeItem(TOKEN_KEY); return false; }
    // Check cohort expiration
    if (new Date() > new Date(cohort.expires)) {
      localStorage.removeItem(TOKEN_KEY);
      return false;
    }
    return true;
  } catch(e) {
    return false;
  }
}

// ── HASH FUNCTION ──
async function sha256(str) {
  const data = new TextEncoder().encode(str.toUpperCase().trim());
  const buf  = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf))
    .map(b => b.toString(16).padStart(2,'0')).join('');
}

// ── CHECK CODE ──
async function checkCode() {
  const input = document.getElementById('passcode').value.trim();
  const msgEl = document.getElementById('gate-msg');

  if (!input) {
    showMessage('error', 'Please enter your cohort passcode.');
    return;
  }

  const inputHash = await sha256(input);
  const today     = new Date();

  // Search cohorts
  const match = COHORTS.find(c => c.hash === inputHash);

  if (!match) {
    // Wrong code
    showMessage('error', 'That passcode wasn\'t recognized. Please check with your facilitators and try again.');
    document.getElementById('passcode').classList.add('shake');
    setTimeout(() => document.getElementById('passcode').classList.remove('shake'), 500);
    return;
  }

  if (today > new Date(match.expires)) {
    // Right code, but expired
    showMessage('expired',
      `Your Post-Journey access for this cohort expired on ${new Date(match.expires).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}.<br><br>
      To inquire about continued access or upcoming retreats, contact Brian and Candi at
      <a href="mailto:brianc@citylightvicksburg.org">brianc@citylightvicksburg.org</a>.`
    );
    return;
  }

  // Valid — store token and redirect
  const token = {
    hash:    match.hash,
    expires: Date.now() + (TOKEN_DAYS * 24 * 60 * 60 * 1000)
  };
  localStorage.setItem(TOKEN_KEY, JSON.stringify(token));

  showMessage('success', 'Access granted. Welcome back to your journey.');
  setTimeout(() => { window.location.href = 'hub.html'; }, 1200);
}

// ── SHOW MESSAGE ──
function showMessage(type, html) {
  const el = document.getElementById('gate-msg');
  el.className = 'gate-message ' + type;
  el.innerHTML = html;
  el.style.display = 'block';
}

// ── ON LOAD: skip gate if already authenticated ──
if (isAuthenticated()) {
  window.location.replace('hub.html');
}
</script>
</body>
</html>
