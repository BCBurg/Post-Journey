<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REFLECT | REFRESH — Cohort Code Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0d0d0d; --gold: #f0bc2e; --gold-dim: #7a6018;
    --gold-faint: rgba(240,188,46,0.15); --white: #ffffff;
    --text-muted: rgba(255,255,255,0.5); --border: rgba(255,255,255,0.1);
    --green: #4caf7d;
  }
  html, body { min-height: 100%; background: var(--black); color: var(--white); font-family: 'Cinzel', serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
  .wrap { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 2rem; }
  .logo { height: 44px; width: auto; display: block; margin: 0 auto; }
  .gold-rule { width: 60px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 0 auto; }
  h1 { font-size: clamp(1.1rem, 2.5vw, 1.4rem); color: var(--gold); letter-spacing: 0.12em; text-align: center; }
  .subtitle { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(1rem, 1.8vw, 1.15rem); color: var(--text-muted); text-align: center; line-height: 1.6; }
  .field-label { font-size: 0.75rem; letter-spacing: 0.22em; color: var(--gold-dim); text-transform: uppercase; display: block; margin-bottom: 0.5rem; }
  .field-input {
    width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    color: var(--white); font-family: 'Cinzel', serif; font-size: clamp(1rem, 1.8vw, 1.1rem);
    letter-spacing: 0.1em; padding: 0.9rem 1.1rem; outline: none; transition: border-color 0.2s;
    text-transform: uppercase;
  }
  .field-input:focus { border-color: var(--gold); }
  .btn {
    font-family: 'Cinzel', serif; font-size: 0.88rem; font-weight: 700; letter-spacing: 0.2em;
    padding: 1rem 2rem; border: 2px solid var(--gold); background: transparent; color: var(--white);
    cursor: pointer; transition: all 0.25s; text-transform: uppercase; width: 100%;
  }
  .btn:hover { background: var(--gold); color: var(--black); }
  .result-box {
    display: none; border: 1px solid var(--green); background: rgba(76,175,125,0.06);
    padding: 1.5rem; flex-direction: column; gap: 1rem;
  }
  .result-label { font-size: 0.7rem; letter-spacing: 0.25em; color: var(--gold-dim); text-transform: uppercase; }
  .result-value {
    font-family: 'Cormorant Garamond', serif; font-size: clamp(0.85rem, 1.5vw, 1rem);
    color: var(--white); word-break: break-all; line-height: 1.5;
    background: rgba(255,255,255,0.04); padding: 0.75rem 1rem; border: 1px solid var(--border);
  }
  .copy-btn {
    font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.18em;
    padding: 0.55rem 1rem; border: 1px solid var(--gold-dim); background: transparent;
    color: var(--gold-dim); cursor: pointer; transition: all 0.2s; text-transform: uppercase; align-self: flex-start;
  }
  .copy-btn:hover { border-color: var(--gold); color: var(--gold); }
  .snippet-box {
    display: none; border: 1px solid var(--gold-faint); padding: 1.5rem; flex-direction: column; gap: 1rem;
  }
  .snippet-label { font-size: 0.7rem; letter-spacing: 0.25em; color: var(--gold-dim); text-transform: uppercase; }
  .snippet-code {
    font-family: monospace; font-size: 0.82rem; color: rgba(255,255,255,0.8);
    background: rgba(255,255,255,0.03); padding: 1rem; border: 1px solid var(--border);
    white-space: pre; overflow-x: auto; line-height: 1.6;
  }
  .warning {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: clamp(0.9rem, 1.5vw, 1.05rem); color: rgba(255,100,100,0.7);
    border: 1px solid rgba(255,100,100,0.2); padding: 1rem; text-align: center; line-height: 1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <a href="https://reflectrefresh.org">
    <img class="logo" src="../REFLECT_REFRESH_Brand_White.png" alt="Reflect Refresh">
  </a>
  <div class="gold-rule"></div>
  <h1>Cohort Code Generator</h1>
  <p class="subtitle">Generate a secure hash for a new cohort passcode.<br>Keep this page private — for facilitators only.</p>

  <div class="warning">⚠ Do not share this page URL with retreat participants.</div>

  <div>
    <label class="field-label" for="new-code">New Passcode</label>
    <input class="field-input" id="new-code" type="text" placeholder="E.g. MYCHURCH2027"
      autocomplete="off" autocorrect="off" spellcheck="false"
      onkeydown="if(event.key==='Enter') generate()">
  </div>

  <div>
    <label class="field-label" for="expires">Access Expires On</label>
    <input class="field-input" id="expires" type="date" style="color:rgba(255,255,255,0.8);">
  </div>

  <div>
    <label class="field-label" for="cohort-label">Cohort Label (for your reference)</label>
    <input class="field-input" id="cohort-label" type="text" placeholder="E.g. First Baptist — June 2027"
      style="text-transform:none;">
  </div>

  <button class="btn" onclick="generate()">Generate Hash</button>

  <div class="result-box" id="result-box">
    <div class="result-label">SHA-256 Hash</div>
    <div class="result-value" id="result-hash"></div>
    <button class="copy-btn" onclick="copyHash()">Copy Hash</button>
  </div>

  <div class="snippet-box" id="snippet-box">
    <div class="snippet-label">Add This to gate.html → COHORTS array</div>
    <div class="snippet-code" id="snippet-code"></div>
    <button class="copy-btn" onclick="copySnippet()">Copy Snippet</button>
  </div>
</div>

<script>
  // Pre-fill expiry to 6 months from today
  const d = new Date();
  d.setMonth(d.getMonth() + 6);
  document.getElementById('expires').value = d.toISOString().slice(0,10);

  async function sha256(str) {
    const data = new TextEncoder().encode(str.toUpperCase().trim());
    const buf  = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  async function generate() {
    const code    = document.getElementById('new-code').value.trim();
    const expires = document.getElementById('expires').value;
    const label   = document.getElementById('cohort-label').value.trim() || 'New Cohort';

    if (!code)    { alert('Please enter a passcode.'); return; }
    if (!expires) { alert('Please set an expiration date.'); return; }

    const hash = await sha256(code);

    document.getElementById('result-hash').textContent = hash;
    document.getElementById('result-box').style.display = 'flex';

    const snippet = `  {\n    label:   '${label}',\n    hash:    '${hash}',\n    expires: '${expires}'\n  },`;
    document.getElementById('snippet-code').textContent = snippet;
    document.getElementById('snippet-box').style.display = 'flex';
  }

  function copyHash() {
    navigator.clipboard.writeText(document.getElementById('result-hash').textContent);
    alert('Hash copied!');
  }

  function copySnippet() {
    navigator.clipboard.writeText(document.getElementById('snippet-code').textContent);
    alert('Snippet copied! Paste it into the COHORTS array in gate.html.');
  }
</script>
</body>
</html>
